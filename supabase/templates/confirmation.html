<!doctype html>
<html>
  <body style="margin:0;background:#130d0a;font-family:Helvetica,Arial,sans-serif;color:#f5efe9">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#1f1612;border:1px solid #33261f;border-radius:20px;padding:36px">
            <tr><td style="font-size:20px;font-weight:600;color:#F2711C">ReEdit</td></tr>
            <tr><td style="padding-top:24px;font-size:24px;font-weight:600">Confirm your email</td></tr>
            <tr>
              <td style="padding-top:12px;font-size:15px;line-height:1.6;color:#c9bcb2">
                Confirm this is your email to finish creating your ReEdit account.
              </td>
            </tr>
            <tr>
              <td style="padding-top:28px">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
                   style="display:inline-block;background:#F2711C;color:#fff;text-decoration:none;font-weight:600;padding:14px 22px;border-radius:12px">
                  Confirm my email
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding-top:28px;font-size:12px;color:#8c7d72">
                If you didn't sign up for ReEdit, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
